services:
  # MySQL 8.0 service
  mysql:
    image: mysql:8.0
    container_name: timemachine_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-tm_password}
      MYSQL_DATABASE: ${DB_NAME:-timemachine}
      MYSQL_USER: ${DB_USER:-tm_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-tm_password}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - ./schema_mysql.sql:/docker-entrypoint-initdb.d/01_schema_mysql.sql:ro
      - mysql_data:/var/lib/mysql

  # MariaDB 11.4 service
  mariadb:
    image: mariadb:11.4
    container_name: timemachine_mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_PASSWORD:-tm_password}
      MARIADB_DATABASE: ${MARIADB_NAME:-timemachine}
      MARIADB_USER: ${MARIADB_USER:-tm_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-tm_password}
    ports:
      - "127.0.0.1:${MARIADB_PORT:-3307}:3306"
    volumes:
      - ./schema_mariadb.sql:/docker-entrypoint-initdb.d/01_schema_mariadb.sql:ro
      - mariadb_data:/var/lib/mysql

volumes:
  mysql_data:
  mariadb_data:
